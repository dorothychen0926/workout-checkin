<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>運動打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column. Month header, calendar, check-in form for the picked day, then this month's stats. */
:root {
  --bg: #EEF4F3;
  --surface: #FFFFFF;
  --fg: #14282A;
  --muted: #566B6D;
  --line: #D5E2E0;
  --accent: #0E7C6B;
  --on-accent: #FFFFFF;
  --accent-ink: #0B6455;
  --i1: #CDEAE4;
  --i1-ink: #0A5448;
  --i2: #62BBA8;
  --i2-ink: #05332B;
  --i3: #0E7C6B;
  --i3-ink: #FFFFFF;
  --warn: #B4472B;
  --stamp: #C4402B;
  --blue-bg: #DCE9F7;
  --blue-ink: #1B4A7A;
  --blue-bar: #3E7CC0;
  --amber-bg: #F6E7C6;
  --amber-ink: #6B4A0B;
  --amber-bar: #B87810;
  --violet-bg: #E6DEF5;
  --violet-ink: #47328A;
  --violet-bar: #7B61C4;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1718;
    --surface: #152325;
    --fg: #E4EFEE;
    --muted: #93AAAB;
    --line: #26393B;
    --accent: #4CC5AE;
    --on-accent: #06302A;
    --accent-ink: #6FD6C0;
    --i1: #1D4A43;
    --i1-ink: #BDEBE1;
    --i2: #257A6B;
    --i2-ink: #FFFFFF;
    --i3: #4CC5AE;
    --i3-ink: #052B25;
    --warn: #FF9A80;
    --stamp: #FF8A70;
    --blue-bg: #1B3350;
    --blue-ink: #BBD6F5;
    --blue-bar: #6BA6E8;
    --amber-bg: #4A3A14;
    --amber-ink: #F3DDA6;
    --amber-bar: #E0A93E;
    --violet-bg: #33284F;
    --violet-ink: #D9CCF5;
    --violet-bar: #A48DE8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1718;
  --surface: #152325;
  --fg: #E4EFEE;
  --muted: #93AAAB;
  --line: #26393B;
  --accent: #4CC5AE;
  --on-accent: #06302A;
  --accent-ink: #6FD6C0;
  --i1: #1D4A43;
  --i1-ink: #BDEBE1;
  --i2: #257A6B;
  --i2-ink: #FFFFFF;
  --i3: #4CC5AE;
  --i3-ink: #052B25;
  --warn: #FF9A80;
  --stamp: #FF8A70;
  --blue-bg: #1B3350;
  --blue-ink: #BBD6F5;
  --blue-bar: #6BA6E8;
  --amber-bg: #4A3A14;
  --amber-ink: #F3DDA6;
  --amber-bar: #E0A93E;
  --violet-bg: #33284F;
  --violet-ink: #D9CCF5;
  --violet-bar: #A48DE8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent-ink);
  outline-offset: 2px;
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
}
h1, h2, h3, p { margin: 0; }
h2 { font-size: 17px; font-weight: 700; text-wrap: balance; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.08em; }
h1 { font-size: 28px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
h1 .yr { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.nav { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
}
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.back-now {
  height: 40px; padding: 0 12px;
  border: 1px solid var(--accent-ink);
  background: transparent;
  color: var(--accent-ink);
  border-radius: 12px;
  font-size: 14px; font-weight: 500;
}
.slogan { font-size: 13px; font-weight: 500; color: var(--accent-ink); letter-spacing: 0.08em; margin-top: -4px; text-wrap: balance; }
.status { font-size: 13px; color: var(--muted); margin-top: -6px; }
.status:empty { display: none; }

/* calendar */
.dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { margin-bottom: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.day {
  position: relative;
  aspect-ratio: 1;
  max-width: 100%;
  border: 0;
  border-radius: 10px;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-num);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  padding: 0;
}
.day .dn { position: absolute; top: 5px; left: 6px; font-size: 11px; line-height: 1; }
.day .stamp { position: absolute; left: 58%; top: 61%; width: 66%; height: auto; color: var(--stamp); opacity: 0.92; transform: translate(-50%, -50%) rotate(-12deg); pointer-events: none; }
.day:disabled { opacity: 0.4; cursor: default; }
.day.today { font-weight: 700; box-shadow: inset 0 0 0 2px var(--accent-ink); }
.day[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 2px; }
.legend-note { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; font-size: 12px; color: var(--muted); }
.legend-note svg { width: 22px; height: 22px; flex: none; color: var(--stamp); transform: rotate(-12deg); }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.sw.l1 { background: var(--i1); } .sw.l2 { background: var(--i2); } .sw.l3 { background: var(--i3); }

/* day panel */
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 500; color: var(--accent-ink); }
.entries { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.entry {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center;
  padding: 10px 12px; background: var(--bg); border-radius: 10px;
}
.entry .what { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.entry strong { font-weight: 700; overflow-wrap: anywhere; }
.entry .where { grid-column: 1; font-size: 13px; color: var(--muted); }
.entry .del { grid-row: 1 / span 2; grid-column: 2; border: 0; background: transparent; color: var(--muted); min-height: 40px; padding: 0 8px; border-radius: 8px; font-size: 13px; }
.entry .del.sure { color: var(--warn); font-weight: 700; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 500; }
.pill.l1 { background: var(--i1); color: var(--i1-ink); }
.pill.l2 { background: var(--i2); color: var(--i2-ink); }
.pill.l3 { background: var(--i3); color: var(--i3-ink); }
.pill.relax { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.empty { color: var(--muted); font-size: 14px; margin-top: 12px; }

form { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 16px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset:disabled { opacity: 0.4; }
fieldset:disabled button, fieldset:disabled input { cursor: default; }
legend, .lab-title { font-size: 13px; font-weight: 700; color: var(--muted); padding: 0; margin-bottom: 8px; letter-spacing: 0.04em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 40px; padding: 6px 14px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; font-size: 14px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); min-height: 44px; font-size: 14px; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-checked="true"] { font-weight: 700; }
.seg button.l1[aria-checked="true"] { background: var(--i1); color: var(--i1-ink); }
.seg button.l2[aria-checked="true"] { background: var(--i2); color: var(--i2-ink); }
.seg button.l3[aria-checked="true"] { background: var(--i3); color: var(--i3-ink); }
.hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
.hint.err { color: var(--warn); }
.add-row { display: flex; gap: 8px; margin-top: 10px; }
.add-row .text-in { margin-top: 0; flex: 1; min-width: 0; width: auto; }
.add-btn { min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.link-btn { margin-top: 12px; min-height: 40px; padding: 0; border: 0; background: transparent; color: var(--muted); font-size: 13px; text-decoration: underline; }
.text-in {
  width: 100%; margin-top: 10px; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--fg); font: inherit;
}
.submit {
  min-height: 48px; border: 0; border-radius: 12px;
  background: var(--accent); color: var(--on-accent);
  font-size: 16px; font-weight: 700;
}
.msg { font-size: 14px; min-height: 1.5em; color: var(--accent-ink); margin-top: -8px; }
.msg.err { color: var(--warn); }

/* stats */
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; }
.stat { padding: 0 10px; min-width: 0; border-left: 1px solid var(--line); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat .big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
.stat .big small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.stat .cap { font-size: 12px; color: var(--muted); }
.block { margin-top: 24px; }
.block h3 { margin: 0 0 12px; padding: 8px 12px; border-radius: 10px; font-size: 16px; font-weight: 700; letter-spacing: 0.04em; background: var(--sec-bg); color: var(--sec-ink); }
.sec-blue { --sec-bg: var(--blue-bg); --sec-ink: var(--blue-ink); --sec-bar: var(--blue-bar); }
.sec-teal { --sec-bg: var(--i1); --sec-ink: var(--i1-ink); }
.sec-amber { --sec-bg: var(--amber-bg); --sec-ink: var(--amber-ink); --sec-bar: var(--amber-bar); }
.sec-violet { --sec-bg: var(--violet-bg); --sec-ink: var(--violet-ink); --sec-bar: var(--violet-bar); }
.block .note { margin-top: 10px; }
.bars { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) 2em; gap: 10px; align-items: center; font-size: 14px; }
.row .l { overflow-wrap: anywhere; line-height: 1.3; }
.row .track { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.row .track b { display: block; height: 100%; background: var(--sec-bar, var(--accent)); border-radius: 999px; }
.row .track b.relax { background: var(--accent); }
.row .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }
.stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--bg); gap: 2px; }
.stack b { display: block; height: 100%; }
.stack b.l1 { background: var(--i1); } .stack b.l2 { background: var(--i2); } .stack b.l3 { background: var(--i3); }
.stack-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 13px; }
.stack-legend span { display: inline-flex; align-items: center; gap: 6px; }
.note { font-size: 12px; color: var(--muted); margin-top: 16px; }
.mins-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--muted); }
.mins-row .text-in { margin-top: 0; width: 9.5em; }
.entry .mins { font-size: 13px; color: var(--muted); }
.time2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.time2 > div { padding: 0 12px; border-left: 1px solid var(--line); min-width: 0; }
.time2 > div:first-child { padding-left: 0; border-left: 0; }
.time2 .big2 { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; line-height: 1.3; }
.time2 .big2 small { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 2px; }
.time2 .cap { font-size: 12px; color: var(--muted); }
.goal { margin-top: 16px; }
.goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 6px; }
.goal .track { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; }
.goal .track b { display: block; height: 100%; background: var(--sec-bar, var(--accent)); border-radius: 999px; }

@media (prefers-reduced-motion: no-preference) {
  .chip, .day, .seg button, .submit { transition: background-color 0.15s, color 0.15s; }
  .day .stamp.fresh { animation: stamp-down 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.15) both; }
}
@keyframes stamp-down {
  from { opacity: 0; transform: translate(-50%, -50%) rotate(-24deg) scale(1.8); }
  to { opacity: 0.92; transform: translate(-50%, -50%) rotate(-12deg) scale(1); }
}
</style>
</head>
<body>
<main class="wrap" id="app">
  <header class="top">
    <div>
      <p class="eyebrow">運動打卡</p>
      <h1 id="month-title">&nbsp;</h1>
    </div>
    <div class="nav">
      <button type="button" class="back-now" id="back-now" data-action="today" hidden>回到本月</button>
      <button type="button" class="icon-btn" data-action="prev" aria-label="上一個月">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button type="button" class="icon-btn" id="next-btn" data-action="next" aria-label="下一個月">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>
  <p class="slogan" id="slogan"></p>
  <p class="status" id="status" role="status">正在讀取你的紀錄…</p>

  <section class="card" aria-label="月曆">
    <div class="dow" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
    <div class="grid" id="cal"></div>
    <p class="legend-note"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17.5" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="20" cy="20" r="13.8" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M12.5 20.8l5.2 5.2 9.8-11.2" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>蓋章代表當天已打卡（只做滾筒、伸展不蓋章），顏色淡的日子還沒到。</span></p>
  </section>

  <section class="card" aria-label="打卡">
    <div class="day-head">
      <h2 id="day-title"></h2>
      <span class="tag" id="day-tag"></span>
    </div>
    <ul class="entries" id="entries"></ul>
    <p class="empty" id="entries-empty" hidden>這天還沒有紀錄。選好項目、時間、強度和部位後按打卡。</p>

    <form id="f" autocomplete="off" novalidate>
      <fieldset>
        <legend>運動項目</legend>
        <div class="chips" id="sports"></div>
        <div id="other-wrap" hidden>
          <div class="add-row">
            <input class="text-in" id="other" type="text" maxlength="12" placeholder="輸入新的運動名稱，例如：登山" aria-label="新的運動名稱">
            <button type="button" class="add-btn" data-action="addsport">加入</button>
          </div>
          <p class="hint" id="other-hint">加入後會一直留在上面的選項裡。</p>
        </div>
        <p class="hint" id="relax-hint" hidden>滾筒、伸展是放鬆項目：不用填時間、強度和部位，也不計入打卡天數，只會出現在運動項目的次數統計。</p>
      </fieldset>
      <fieldset id="fs-time">
        <legend>運動時間</legend>
        <div class="chips" id="mins-chips"></div>
        <div class="mins-row">
          <input class="text-in" id="mins" type="number" inputmode="decimal" min="0.5" max="600" step="0.5" placeholder="自己輸入" aria-label="運動分鐘數">
          <span>分鐘</span>
        </div>
      </fieldset>
      <fieldset id="fs-level">
        <legend>強度</legend>
        <div class="seg" id="levels" role="radiogroup" aria-label="強度"></div>
        <p class="hint" id="level-hint"></p>
      </fieldset>
      <fieldset id="fs-parts">
        <legend>運動部位（可多選）</legend>
        <div class="chips" id="parts"></div>
        <div id="part-other-wrap" hidden>
          <div class="add-row">
            <input class="text-in" id="part-other" type="text" maxlength="12" placeholder="輸入新的運動部位，例如：頸部" aria-label="新的運動部位">
            <button type="button" class="add-btn" data-action="addpart">加入</button>
          </div>
          <p class="hint" id="part-other-hint">加入後會一直留在上面的選項裡。</p>
        </div>
      </fieldset>
      <button type="submit" class="submit" id="submit">今天打卡</button>
      <p class="msg" id="msg" role="status"></p>
    </form>
  </section>

  <section class="card" aria-label="本月統計">
    <h2 id="stats-title">本月統計</h2>
    <div id="stats"></div>
  </section>

  <section class="card" id="sync-card" aria-label="雲端同步" hidden>
    <h2>雲端同步</h2>
    <p class="hint" id="sync-state">尚未啟用，紀錄只存在這個瀏覽器。</p>
    <div class="add-row">
      <input class="text-in" id="sync-url" type="url" inputmode="url" autocomplete="off" placeholder="貼上 Google 試算表的同步網址" aria-label="Google 試算表同步網址">
      <button type="button" class="add-btn" data-action="savesync">儲存</button>
    </div>
    <button type="button" class="link-btn" id="sync-off" data-action="clearsync" hidden>停用同步</button>
  </section>
</main>

<script>
(function () {
  var SPORTS = ['跑步', '快走', '散步', '爬樓梯', '騎單車', '游泳', '跳繩', '重量訓練', '彈力繩', '徒手肌力', '棒式', '伸展', '滾筒'];
  var RELAX = ['滾筒', '伸展'];   // relax items: only counted in the sports bar chart, nowhere else
  var OTHER = '其它';        // chip that opens the add-a-new-item box
  var RENAMES = { '騎車': '騎單車', '徒手訓練': '徒手肌力', '瑜伽伸展': '伸展' };   // old names found in saved records
  var CUSTOM_KEY = 'workout-checkin-custom-v2';       // { sports: [], parts: [] }
  var CUSTOM_KEY_V1 = 'workout-checkin-custom-v1';   // older format: sports only
  var PARTS = ['胸', '背', '手臂', '肩', '核心', '腹部', '臀', '腿', '心肺', '肢體協調', '肢體靈活', '全身', '全身代謝'];
  var LEVELS = [

    syncForm();
    renderAll();
    showMsg(stamped ? '已蓋章！' : '已記錄。');
  }

  function removeEntry(k, i) {
    if (!data[k]) return;
    var gone = data[k][i];
    data[k].splice(i, 1);
    if (!data[k].length) delete data[k];
    pendingDel = null;
    persist(k);
    if (gone) queueOp({ op: 'delete', id: gone.id });
    renderAll();
  }

  /* ---------- render ---------- */
  function renderAll() {
    renderHead();
    renderCal();
    renderDay();
    renderStats();
  }

  function renderHead() {
    $('month-title').innerHTML = '<span class="yr">' + view.y + '</span> 年 ' + (view.m + 1) + ' 月';
    $('next-btn').disabled = isCurrentMonth();
    $('back-now').hidden = isCurrentMonth();
    $('stats-title').textContent = isCurrentMonth() ? '本月統計' : (view.m + 1) + ' 月統計';
  }

  function renderCal() {
    var first = new Date(view.y, view.m, 1);
    var total = new Date(view.y, view.m + 1, 0).getDate();
    var h = '';
    for (var i = 0; i < first.getDay(); i++) h += '<span></span>';
    for (var d = 1; d <= total; d++) {
      var k = keyOf(view.y, view.m, d);
      var list = data[k] || [];
      var exN = list.filter(function (e) { return !isRelax(e.sport); }).length;
      var done = exN > 0;
      var future = k > todayKey;
      var cls = 'day' + (k === todayKey ? ' today' : '');
      var label = (view.m + 1) + '月' + d + '日' + (done ? '，已蓋章，共 ' + exN + ' 筆' : '') + (k === todayKey ? '，今天' : '');
      h += '<button type="button" class="' + cls + '" data-action="pick" data-key="' + k + '"' +
        (future ? ' disabled' : '') + ' aria-pressed="' + (k === selected) + '" aria-label="' + label + '"><span class="dn">' + d + '</span>' + (done ? stampSVG(k === freshKey) : '') + '</button>';
    }
    $('cal').innerHTML = h;
  }

  function renderDay() {
    var p = selected.split('-').map(Number);
    var dt = new Date(p[0], p[1] - 1, p[2]);
    $('day-title').textContent = p[1] + ' 月 ' + p[2] + ' 日（週' + WEEK[dt.getDay()] + '）';
    $('day-tag').textContent = selected === todayKey ? '今天' : (selected < todayKey ? '補記過去的日子' : '');
    $('submit').textContent = selected === todayKey ? '今天打卡' : '補記這天';
    $('submit').disabled = selected > todayKey;

    var list = data[selected] || [];
    $('entries-empty').hidden = list.length > 0;
    $('entries').innerHTML = list.map(function (e, i) {
      var sure = pendingDel && pendingDel.k === selected && pendingDel.i === i;
      var rx = isRelax(e.sport);
      return '<li class="entry"><div class="what"><strong>' + esc(e.sport) + '</strong>' +
        (rx ? '<span class="pill relax">放鬆</span>' : '<span class="pill l' + e.level + '">' + LEVELS[e.level - 1].name + '</span>') +
        (e.mins ? '<span class="mins num">' + fmtNum(e.mins) + ' 分鐘</span>' : '') + '</div>' +
        '<div class="where">' + (rx ? '只計入項目次數' : (e.parts.length ? e.parts.map(esc).join('・') : '未選部位')) + '</div>' +
        '<button type="button" class="del' + (sure ? ' sure' : '') + '" data-action="del" data-i="' + i + '" aria-label="刪除這筆紀錄">' +
        (sure ? '確定刪除？' : '刪除') + '</button></li>';
    }).join('');
  }

  function fmtMins(m) {
    if (m >= 60) {
      var h = Math.floor(m / 60);
      return h + '<small>小時</small> ' + fmtNum(m - h * 60) + '<small>分</small>';
    }
    return fmtNum(m) + '<small>分</small>';
  }
  /* the week containing today, Sunday to Saturday like the calendar; counts across month boundaries */
  function weekStats() {
    var start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
    var days = 0, mins = 0;
    for (var i = 0; i < 7; i++) {
      var dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var list = data[keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate())] || [];
      var ex = list.filter(function (e) { return !isRelax(e.sport); });
      if (ex.length) days++;
      ex.forEach(function (e) { mins += e.mins || 0; });
    }
    return { days: days, mins: mins };
  }
  function bars(map, order, markRelax) {
    var names = Object.keys(map);
    if (order) names.sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
    names.sort(function (a, b) { return map[b] - map[a]; });
    var max = names.reduce(function (a, n) { return Math.max(a, map[n]); }, 1);
    return '<div class="bars">' + names.map(function (n) {
      return '<div class="row"><span class="l">' + esc(n) + '</span><span class="track"><b' + (markRelax && isRelax(n) ? ' class="relax"' : '') + ' style="width:' +
        Math.round(map[n] / max * 100) + '%"></b></span><span class="v">' + map[n] + '</span></div>';
    }).join('') + '</div>';
  }

  function renderStats() {
    var total = new Date(view.y, view.m + 1, 0).getDate();
    var days = 0, count = 0, totalMins = 0, timed = 0, relaxN = 0;
    var sports = {}, parts = {}, levels = { 1: 0, 2: 0, 3: 0 };
    for (var d = 1; d <= total; d++) {
      var list = data[keyOf(view.y, view.m, d)] || [];
      var exDay = false;
      list.forEach(function (e) {
        sports[e.sport] = (sports[e.sport] || 0) + 1;     // every item counts in the sports bar chart
        if (isRelax(e.sport)) { relaxN++; return; }       // relax items stop here
        exDay = true;
        count++;
        if (e.mins) { totalMins += e.mins; timed++; }
        levels[e.level]++;
        e.parts.forEach(function (p) { parts[p] = (parts[p] || 0) + 1; });
      });
      if (exDay) days++;
    }
    if (!count && !relaxN) {
      $('stats').innerHTML = '<p class="empty">這個月還沒有紀錄。在月曆上選一天打卡，統計會出現在這裡。</p>';
      return;
    }
    var cur = isCurrentMonth();
    var wk = weekStats();
    var weekCell = cur
      ? '<div class="stat"><div class="big">' + wk.days + '<small>/7 天</small></div><div class="cap">本週運動天數</div></div>'
      : '<div class="stat"><div class="big">' + (Math.round(days * 7 / total * 10) / 10) + '<small>/7 天</small></div><div class="cap">平均每週運動天數</div></div>';
    var h = '<div class="stats3">' +
      '<div class="stat"><div class="big">' + days + '<small>/' + total + ' 天</small></div><div class="cap">打卡天數</div></div>' +
      '<div class="stat"><div class="big">' + count + '<small>筆</small></div><div class="cap">運動紀錄</div></div>' +
      weekCell + '</div>';
    var tb = '<div class="block sec-violet"><h3>運動時間</h3>';
    if (timed) {
      tb += '<div class="time2">' +
        '<div><div class="big2">' + fmtMins(totalMins) + '</div><div class="cap">累計時間</div></div>' +
        '<div><div class="big2">' + fmtMins(totalMins / timed >= 10 ? Math.round(totalMins / timed) : Math.round(totalMins / timed * 10) / 10) + '</div><div class="cap">每次平均</div></div></div>';
    }
    if (cur) {
      var pct = Math.min(100, Math.round(wk.mins / WEEK_GOAL * 100));
      tb += '<div class="goal"><div class="goal-top"><span>本週 <span class="num">' + fmtNum(wk.mins) + '</span> / ' + WEEK_GOAL + ' 分鐘</span><span class="num">' + (wk.mins >= WEEK_GOAL ? '已達標' : pct + '%') + '</span></div>' +
        '<div class="track" role="img" aria-label="本週運動時間 ' + fmtNum(wk.mins) + ' 分鐘，參考目標 ' + WEEK_GOAL + ' 分鐘"><b style="width:' + pct + '%"></b></div>' +
        '<p class="hint">參考：世界衛生組織建議成人每週至少 150 分鐘中等強度運動，這裡不分強度，全部計入。</p></div>';
    } else if (!timed) {
      tb += '<p class="empty">這個月沒有記錄運動時間。</p>';
    }
    h += '<div class="block sec-blue"><h3>運動項目</h3>' + bars(sports, null, true) +
      (relaxN ? '<p class="note">綠色長條是放鬆項目（滾筒、伸展），只列入這張圖，不計入打卡天數和其他統計。</p>' : '') + '</div>';
    if (count) h += '<div class="block sec-teal"><h3>強度分布</h3><div class="stack" role="img" aria-label="強度分布">' +
      [1, 2, 3].filter(function (k) { return levels[k]; }).map(function (k) {
        return '<b class="l' + k + '" style="flex:' + levels[k] + '"></b>';
      }).join('') + '</div><div class="stack-legend">' +
      [1, 2, 3].map(function (k) {
        return '<span><i class="sw l' + k + '"></i>' + LEVELS[k - 1].name + ' <span class="num">' + levels[k] + '</span></span>';
      }).join('') + '</div></div>';
    if (count) h += '<div class="block sec-amber"><h3>運動部位</h3>' + bars(parts, PARTS.concat(customParts)) +
      '<p class="note">部位次數以每筆紀錄計算，一筆可以同時算到多個部位。</p></div>';
    if (count) h += tb + '</div>';
    $('stats').innerHTML = h;
  }

  /* ---------- events ---------- */
  function changeMonth(delta) {
    var m = view.m + delta, y = view.y;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    view = { y: y, m: m };
    selected = isCurrentMonth() ? todayKey : keyOf(y, m, 1);
    pendingDel = null;
    renderAll();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-action]');
    if (!b) return;
    var a = b.dataset.action;
    if (a === 'prev') changeMonth(-1);
    else if (a === 'next') { if (!isCurrentMonth()) changeMonth(1); }
    else if (a === 'today') {
      view = { y: now.getFullYear(), m: now.getMonth() };
      selected = todayKey; pendingDel = null; renderAll();
    }
    else if (a === 'pick') { selected = b.dataset.key; pendingDel = null; renderCal(); renderDay(); }
    else if (a === 'sport') {
      form.sport = form.sport === b.dataset.v ? '' : b.dataset.v;
      syncForm();
      if (form.sport === OTHER) { otherHint('', false); $('other').focus(); }
    }
    else if (a === 'addsport') { addCustomSport(); }
    else if (a === 'partother') { form.partsOpen = !form.partsOpen; partHint('', false); syncForm(); if (form.partsOpen) $('part-other').focus(); }
    else if (a === 'addpart') { addCustomPart(); }
    else if (a === 'savesync') { enableSync($('sync-url').value); }
    else if (a === 'clearsync') { disableSync(); }
    else if (a === 'level') { form.level = Number(b.dataset.v); syncForm(); }
    else if (a === 'mins') { var mv = Number(b.dataset.v); form.mins = form.mins === mv ? 0 : mv; syncForm(); }
    else if (a === 'part') {
      var i = form.parts.indexOf(b.dataset.v);
      if (i >= 0) form.parts.splice(i, 1); else form.parts.push(b.dataset.v);
      syncForm();
    }
    else if (a === 'del') {
      var idx = Number(b.dataset.i);
      if (pendingDel && pendingDel.k === selected && pendingDel.i === idx) {
        clearTimeout(pendingTimer);
        removeEntry(selected, idx);
      } else {
        pendingDel = { k: selected, i: idx };
        clearTimeout(pendingTimer);
        pendingTimer = setTimeout(function () { pendingDel = null; renderDay(); }, 3000);
        renderDay();
      }
    }
  });
  $('other').addEventListener('input', function (e) { form.other = e.target.value; });
  $('mins').addEventListener('input', function (e) {
    var v = Math.round(Number(e.target.value) * 2) / 2;   // half-minute steps
    form.mins = v > 0 ? v : 0;
    syncForm();
  });
  $('mins').addEventListener('blur', syncForm);
  $('sync-url').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); enableSync($('sync-url').value); }
  });
  $('part-other').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addCustomPart(); }
  });
  $('other').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addCustomSport(); }
  });
  $('f').addEventListener('submit', function (e) { e.preventDefault(); submit(); });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && sheetUrl && Date.now() - lastPull > 30000) pullSheet();
  });
  window.addEventListener('online', function () { if (sheetUrl) flushQueue(); });
  init();
})();
</script>
</body>
</html>
